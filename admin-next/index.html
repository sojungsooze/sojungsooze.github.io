<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin">
  <title>SOJUNG / 포트폴리오 관리</title>
  <link rel="stylesheet" href="styles.css"><script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">본문 바로가기</a>
  <header class="topbar"><a class="brand" href="./index.html">SOJUNG <span>포트폴리오 관리</span></a><div class="header-actions"><a href="../index.html" target="_blank" rel="noopener">포트폴리오 보기 ↗</a><span id="account"></span><button id="logout" type="button" hidden>로그아웃</button></div></header>
  <main id="main">
    <section id="login" class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">포트폴리오 관리</h1><p class="muted">로그인하고 프로젝트를 수정하세요.</p>
      <form id="login-form"><label>이메일<input name="email" type="email" required autocomplete="username" placeholder="관리자 이메일"></label><label>비밀번호<input name="password" type="password" required autocomplete="current-password"></label><button class="primary" id="login-button" type="submit" disabled>로그인</button></form>
      <p id="login-status" role="status" aria-live="polite">관리자 연결을 확인하고 있어요.</p>
    </section>
    <section id="workspace" hidden>
      <div class="workspace-heading"><h1 id="page-title" tabindex="-1">프로젝트 목록</h1><button class="primary save-button" type="button" data-save disabled aria-describedby="save-status">저장하기</button></div>
      <p id="save-status" class="status" role="status" aria-live="polite">저장한 내용을 불러오고 있어요.</p>
      <div id="draft-notice" class="notice" hidden><span>저장하지 않은 수정 내용이 있어요.</span><button id="restore-draft" type="button">이어서 수정</button><button id="dismiss-draft" type="button">저장된 내용 사용</button></div>
      <div id="view"></div>
    </section>
  </main>
  <noscript>관리자 페이지를 사용하려면 JavaScript를 켜 주세요.</noscript>
</body>
</html>
